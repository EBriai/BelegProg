# Haalt koersen op bij Yahoo en zet ze versleuteld op de branch "koersen".
# Start vanzelf als de app de lijst wijzigt, en elke werkdag na beurssluiting.
name: Koersen ophalen
on:
  push:
    branches: [main]
    paths: [data/tickers.enc]
  schedule:
    - cron: "45 16 * * 1-5"   # na sluiting Europese beurzen
    - cron: "30 21 * * 1-5"   # na sluiting Amerikaanse beurzen
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: koersen
  cancel-in-progress: false
jobs:
  koersen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet --upgrade yfinance cryptography
      - run: python scripts/koersen.py
        env:
          KOERS_KEY: ${{ secrets.KOERS_KEY }}
      - name: Zet resultaat op branch koersen
        if: hashFiles('out/koersen.enc') != ''
        run: |
          cd out
          git init -q -b koersen
          git add koersen.enc
          git -c user.name="koersen-bot" -c user.email="actions@github.com" commit -q -m "Koersen $(date -u +%F\ %H:%M)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" koersen
